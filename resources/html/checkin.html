<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{userName}} · 签到</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1280px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #e6e6e6;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(217,153,50,.20), transparent 70%),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(75,105,255,.10), transparent 70%),
    linear-gradient(135deg, #0e1419 0%, #1a2330 50%, #0e1419 100%);
}
.wrap { padding: 48px 64px 24px; position: relative; }

/* 顶部用户卡 */
.user-card {
  display: flex;
  align-items: center;
  gap: 24px;
  background: linear-gradient(180deg, rgba(40,48,60,.7), rgba(20,26,34,.85));
  border: 1px solid rgba(217,153,50,.3);
  border-radius: 12px;
  padding: 22px 28px;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}
.user-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, #f2b03c 0%, transparent 100%);
}
.avatar-wrap {
  width: 110px; height: 110px;
  border-radius: 50%;
  border: 3px solid #f2b03c;
  box-shadow: 0 0 24px rgba(242,176,60,.4);
  overflow: hidden;
  background: #1a2028;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
.avatar-fallback { font-size: 50px; color: #f2b03c; font-weight: 700; }

.user-info { flex: 1; }
.user-name {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.user-qq {
  font-size: 13px;
  color: rgba(255,255,255,.5);
  letter-spacing: 1px;
}
.user-qq .accent { color: #f2b03c; font-weight: 700; }
.user-ts {
  color: rgba(255,255,255,.4);
  font-size: 12px;
  letter-spacing: 2px;
  text-align: right;
}
.user-ts .big { font-size: 18px; color: rgba(255,255,255,.7); font-weight: 700; }

/* 签到结果 */
.result {
  display: flex;
  align-items: center;
  gap: 36px;
  padding: 28px 36px;
  background: linear-gradient(120deg, rgba(242,176,60,.16), rgba(217,153,50,.04) 60%);
  border: 1px solid rgba(242,176,60,.5);
  border-radius: 12px;
  margin-bottom: 26px;
  position: relative;
}
.result-status {
  flex: 0 0 auto;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f2b03c, #c08020);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  color: #16110a;
  font-weight: 900;
  box-shadow: 0 0 30px rgba(242,176,60,.6);
}
.result-status.failed { background: linear-gradient(135deg, #6a7280, #3a4250); color: #fff; box-shadow: none; }
.result-text { flex: 1; }
.result-msg {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 3px;
  margin-bottom: 10px;
}
.result-reward {
  font-size: 18px;
  color: rgba(255,255,255,.7);
}
.result-reward .num {
  font-size: 38px;
  font-weight: 900;
  color: #f2b03c;
  margin: 0 4px;
  letter-spacing: 2px;
}
.result-sub {
  font-size: 12px;
  color: rgba(255,255,255,.45);
  letter-spacing: 1px;
  margin-top: 8px;
}

/* 统计 4 列 */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 26px;
}
.stat {
  background: linear-gradient(180deg, rgba(40,48,60,.6), rgba(20,26,34,.85));
  border: 1px solid rgba(217,153,50,.22);
  border-radius: 8px;
  padding: 18px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: rgba(242,176,60,.6);
}
.stat-label {
  font-size: 12px;
  color: rgba(255,255,255,.55);
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.stat-value {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
}
.stat-value.gold { color: #f2b03c; }
.stat-value.small { font-size: 15px; line-height: 1.3; padding: 4px 0; }
.stat-sub {
  font-size: 11px;
  color: rgba(255,255,255,.4);
  margin-top: 4px;
  letter-spacing: 1px;
}

/* 最稀有掉落 */
.rarest-card {
  background: linear-gradient(120deg, rgba(40,48,60,.7), rgba(20,26,34,.85));
  border: 1px solid rgba(217,153,50,.22);
  border-radius: 8px;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  position: relative;
  overflow: hidden;
}
.rarest-img {
  width: 130px; height: 90px;
  object-fit: contain;
  background: linear-gradient(180deg, #3a4250, #1a2029);
  border-radius: 4px;
  padding: 6px;
}
.rarest-text { flex: 1; }
.rarest-label {
  font-size: 12px;
  color: rgba(255,255,255,.5);
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.rarest-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
}
.rarest-tier {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 12px;
  font-size: 12px;
  border-radius: 12px;
  border: 1px solid currentColor;
  background: rgba(0,0,0,.3);
}

/* footer */
.cs-global-footer {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,.55);
  letter-spacing: 2px;
  padding: 18px 0 14px;
  font-family: "Microsoft YaHei",sans-serif;
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
}
</style>
</head>
<body>
<div class="wrap">

  <div class="user-card">
    <div class="avatar-wrap">
      <img src="{{@ avatarUrl}}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;avatar-fallback&quot;>{{firstChar}}</div>'">
    </div>
    <div class="user-info">
      <div class="user-name">{{userName}}</div>
      <div class="user-qq">QQ <span class="accent">{{userId}}</span></div>
    </div>
    <div class="user-ts">
      <div class="big">{{dateBig}}</div>
      <div>{{timeSmall}}</div>
    </div>
  </div>

  <div class="result">
    <div class="result-status {{statusCls}}">{{statusIcon}}</div>
    <div class="result-text">
      <div class="result-msg">{{statusMsg}}</div>
      <div class="result-reward">{{@ rewardHtml}}</div>
      <div class="result-sub">{{subMsg}}</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">当前余额</div>
      <div class="stat-value gold">¥ {{coins}}</div>
      <div class="stat-sub">金币</div>
    </div>
    <div class="stat">
      <div class="stat-label">累计开箱</div>
      <div class="stat-value">{{opened}}</div>
      <div class="stat-sub">次</div>
    </div>
    <div class="stat">
      <div class="stat-label">仓库</div>
      <div class="stat-value">{{invCount}}</div>
      <div class="stat-sub">件物品</div>
    </div>
    <div class="stat">
      <div class="stat-label">默认箱</div>
      <div class="stat-value small">{{defaultCase}}</div>
    </div>
  </div>

  {{@ rarestHtml}}

</div>
<div class="cs-global-footer">Trss-Yunzai · cs-opener-plugin · 冰凉到通透</div>
</body>
</html>
