<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CS:GO 开箱模拟器</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/case.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-c">CS</span><span class="logo-go">:GO</span>
      <span class="logo-sub">CASE OPENER</span>
    </div>
    <nav class="nav">
      <a href="#/shop"      data-nav="shop">商城</a>
      <a href="#/inventory" data-nav="inventory">库存</a>
      <a href="#/history"   data-nav="history">记录</a>
      <a href="#/settings"  data-nav="settings">设置</a>
    </nav>
    <div class="wallet">
      <span class="coin-icon">¥</span>
      <span id="coin-amount">0</span>
      <button id="reset-btn" title="重置存档">↻</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="bottombar">
    <span>纯前端模拟器 · localStorage 存档 · 概率仿照 CS:GO 真实掉率</span>
  </footer>

  <script src="assets/data/crates.js" onerror="console.info('[csgo] 本地 crates.js 未生成，将走远程/缓存')"></script>
  <script src="js/data.js"></script>
  <script src="js/rarity.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/views/shop.js"></script>
  <script src="js/views/case.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
