# CSGO 开箱模拟器 配置（保存即热更新，无需重启）

# 新用户初始金币
initialCoins: 10000

# 售价倍率（1.0 = 原版）
sellPriceMultiplier: 1.0

# 标准武器箱默认掉率（万分比，总和 = 100000）
# 3 军规级 / 4 受限 / 5 保密 / 6 隐秘 / 7 罕见特殊
defaultOdds:
  3: 79920
  4: 15980
  5: 3200
  6: 640
  7: 260

# 历史记录最多保留多少条
historyLimit: 500

# 视频生成参数
video:
  fps: 60
  introMs: 2000       # 预览页停留时长
  revealMs: 5500      # 揭示页停留时长
  width: 1280
  height: 720

# Puppeteer 截图视口
puppeteer:
  width: 1280
  height: 720
  scale: 1

# 命令冷却（秒），防刷
cooldown:
  open: 2
  shop: 1

# 资源下载（#csgo 更新数据 / node tools/download_skins.mjs 走这里）
download:
  # HTTP/HTTPS 代理；空字符串 = 直连
  # 优先级：此配置 > 环境变量 HTTPS_PROXY / HTTP_PROXY
  # 例:
  #   proxy: "http://127.0.0.1:7890"     Clash / V2RayN 常用
  #   proxy: "http://user:pass@host:port" 带认证
  proxy: ""
  # 并发下载数
  concurrency: 10
  # 单张图最大重试次数
  retry: 3
